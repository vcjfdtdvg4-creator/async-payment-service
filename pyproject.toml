[project]
name = "async-payment-service"
version = "1.0.0"
description = "Асинхронный сервис обработки платежей: FastAPI + PostgreSQL + RabbitMQ (FastStream), Outbox, retry/DLQ, админка"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115,<1.0",
    "faststream[rabbit,cli]>=0.5.30,<0.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
