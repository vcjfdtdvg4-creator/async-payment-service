{% extends "base.html" %}
{% block title %}Sign in — Payment Service{% endblock %}
{% block content %}
  <div class="login-wrap">
    <form class="card login-card" method="post" action="/ui/login">
      <h1>Sign in</h1>
      <p class="muted">Enter the API key (X-API-Key) to access the admin UI.</p>
      <label>
        API key
        <input type="password" name="api_key" placeholder="super-secret-key" autofocus required>
      </label>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <button type="submit" class="btn primary">Continue</button>
    </form>
  </div>
{% endblock %}
