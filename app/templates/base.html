<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Payment Service{% endblock %}</title>
  <link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/ui/" class="brand">💳 Payment Service</a>
    <nav>
      <a href="/ui/">Payments</a>
      <a href="/ui/payments/new">New payment</a>
      <a href="/ui/outbox">Outbox</a>
      <a href="/ui/queues">Queues</a>
      <a href="/docs" target="_blank" rel="noopener">API docs ↗</a>
      <a href="/ui/logout" class="danger">Logout</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
